<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeris</title>
  <style>
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      font-family: -apple-system, system-ui, sans-serif;
    }
    h1 {
      font-size: 1.1rem; font-weight: 600;
      margin: calc(16px + var(--tg-safe-area-inset-top, 0px)
                   + var(--tg-content-safe-area-inset-top, 0px)) 16px 16px;
    }
    .chart { height: 65vh; padding: 0 12px 16px; }
    #status {
      margin: 12px 16px; font-size: 0.8rem; white-space: pre-wrap;
      color: var(--tg-theme-hint-color, #999);
    }
    .error { color: #e53935 !important; }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <h1 id="title">Expenses</h1>
  <div class="chart"><canvas id="chart"></canvas></div>
  <pre id="status"></pre>
  <script>
    const status = document.getElementById("status");
    function log(msg, isError) {
      status.textContent = msg;
      status.className = isError ? "error" : "";
    }
    window.addEventListener("error", (e) =>
      log("JS error: " + (e.message || e.error), true));

    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        // Go edge-to-edge so it feels like an app screen, not a web viewer.
        // Falls back to the expanded sheet on clients without fullscreen.
        try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
        // Match Telegram's own header and background to the page so the webview
        // blends into the chat instead of looking like a separate window.
        if (tg.setHeaderColor) tg.setHeaderColor("bg_color");
        if (tg.setBackgroundColor) tg.setBackgroundColor("bg_color");
      }

      // Telegram appends its own params to the fragment, so read our named one
      // (d=...) instead of the whole hash. URLSearchParams decodes it for us.
      const raw = new URLSearchParams(location.hash.slice(1)).get("d");
      if (!raw) throw new Error("no data in URL (missing #d=)");
      const data = JSON.parse(raw);
      document.getElementById("title").textContent = data.title || "Expenses";

      if (typeof Chart === "undefined")
        throw new Error("Chart.js did not load (CDN blocked?)");

      const red = "#e53935";
      const themeText = (tg && tg.themeParams && tg.themeParams.text_color) || "#000";
      const datasets = [{
        label: "Expenses",
        data: (data.labels || []).map((d, i) => ({ x: d, y: (data.values || [])[i] })),
        borderColor: red,
        backgroundColor: red + "33",
        fill: true,
        tension: 0.25,
        borderWidth: 4,
        pointRadius: 4,
        pointHoverRadius: 7,
        pointHitRadius: 14,
      }];
      // A black dashed reference line at the month's total income.
      if (data.income) {
        datasets.push({
          label: "Income",
          data: [{ x: 0.5, y: data.income }, { x: 31.5, y: data.income }],
          borderColor: themeText,
          borderWidth: 2,
          borderDash: [6, 6],
          pointRadius: 0,
          pointHitRadius: 0,
          fill: false,
        });
      }

      new Chart(document.getElementById("chart"), {
        type: "line",
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              filter: (item) => item.datasetIndex === 0,
              callbacks: {
                title: (items) => "Day " + items[0].parsed.x,
                label: (item) => "$" + item.parsed.y.toLocaleString(),
              },
            },
          },
          scales: {
            x: {
              type: "linear",
              min: 0.5,
              max: 31.5,
              title: { display: true, text: "Day of month" },
              ticks: {
                includeBounds: false,
                callback: (v) => (Number.isInteger(v) ? v : ""),
              },
            },
            y: {},
          },
        },
      });
    } catch (err) {
      log("Error: " + err.message, true);
    }
  </script>
</body>
</html>
