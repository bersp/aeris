<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeris</title>
  <style>
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      font-family: -apple-system, system-ui, sans-serif;
    }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 16px; }
    .chart { height: 65vh; padding: 0 12px 16px; }
    #status {
      margin: 12px 16px; font-size: 0.8rem; white-space: pre-wrap;
      color: var(--tg-theme-hint-color, #999);
    }
    .error { color: #e53935 !important; }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <h1 id="title">Expenses</h1>
  <div class="chart"><canvas id="chart"></canvas></div>
  <pre id="status"></pre>
  <script>
    const status = document.getElementById("status");
    function log(msg, isError) {
      status.textContent = msg;
      status.className = isError ? "error" : "";
    }
    window.addEventListener("error", (e) =>
      log("JS error: " + (e.message || e.error), true));

    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }

      // Telegram appends its own params to the fragment, so read our named one
      // (d=...) instead of the whole hash. URLSearchParams decodes it for us.
      const raw = new URLSearchParams(location.hash.slice(1)).get("d");
      if (!raw) throw new Error("no data in URL (missing #d=)");
      const data = JSON.parse(raw);
      document.getElementById("title").textContent = data.title || "Expenses";

      if (typeof Chart === "undefined")
        throw new Error("Chart.js did not load (CDN blocked?)");

      const accent = (tg && tg.themeParams && tg.themeParams.button_color) || "#2481cc";
      new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
          labels: data.labels || [],
          datasets: [{
            data: data.values || [],
            borderColor: accent,
            backgroundColor: accent + "33",
            fill: true,
            tension: 0.25,
            pointRadius: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { title: { display: true, text: "Day of month" } },
            y: { beginAtZero: true },
          },
        },
      });
    } catch (err) {
      log("Error: " + err.message, true);
    }
  </script>
</body>
</html>
